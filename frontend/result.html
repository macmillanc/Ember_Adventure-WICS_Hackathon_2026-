<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Ember Bus Route</title>


    <!-- =================================================
         LEAFLET
         ================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <style>

        /* =================================================
           PAGE
           ================================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background-color: #d6bea0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        body {
            min-height: 100vh;
            padding: 30px 0;
        }


        * {
            box-sizing: border-box;
        }


        /* =================================================
           POSTCARD
           ================================================= */

        .postcard {
            width: 96%;

            max-width: 1500px;

            margin: 0 auto;

            background-color: white;

            border: 14px solid #d4ddd8;

            outline: 3px solid #8b5e3c;

            padding: 45px 65px;

            box-shadow:
                15px 15px 30px
                rgba(0, 0, 0, 0.25);

            position: relative;
        }


        .postcard::before {
            content: "";

            position: absolute;

            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;

            border:
                3px dashed #71c7a3;

            pointer-events: none;
        }


        h1 {
            text-align: center;

            font-size: 45px;

            color: #e8587a;

            margin:
                10px
                0
                5px;

            letter-spacing: 3px;
        }


        .subtitle {
            text-align: center;

            font-size: 18px;

            color: #18201d;

            margin-bottom: 30px;
        }


        /* =================================================
           MAP
           ================================================= */

        .map-wrapper {
            width: 100%;
            height: 380px;

            position: relative;

            overflow: hidden;

            border:
                4px solid #18201d;

            border-radius: 8px;

            margin-bottom: 35px;

            background: #ddd;
        }


        #map {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;
        }


        /*
         * Leaflet must use its normal content-box model.
         * Keep the global postcard box-sizing rules away
         * from the Leaflet internals.
         */

        #map.leaflet-container,
        #map.leaflet-container * {
            box-sizing: content-box;
        }


        #map.leaflet-container {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ddd;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        #map .leaflet-tile {
            width: 256px !important;
            height: 256px !important;

            max-width: none !important;
            max-height: none !important;

            margin: 0 !important;
            padding: 0 !important;

            border: 0 !important;
        }


        #map .leaflet-tile-container img {
            width: 256px !important;
            height: 256px !important;

            max-width: none !important;
            max-height: none !important;
        }


        /* =================================================
           ROUTE
           ================================================= */

        .route-wrapper {
            width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            padding:
                15px
                50px
                35px
                15px;
        }


        .route {
            position: relative;

            display: flex;

            width: max-content;

            min-width: 1100px;

            padding:
                0
                60px;
        }


        /* =================================================
           ARROW LINE
           ================================================= */

        .route-arrow-line {
            position: absolute;

            left: 60px;
            right: 60px;

            top: 85px;

            height: 8px;

            background-color: #b64b2a;

            border-radius: 10px;

            z-index: 1;
        }


        .route-arrow-line::after {
            content: "";

            position: absolute;

            right: -42px;

            top: -16px;

            width: 0;
            height: 0;

            border-top:
                20px solid transparent;

            border-bottom:
                20px solid transparent;

            border-left:
                45px solid #b64b2a;
        }


        /* =================================================
           ROUTE ITEM
           ================================================= */

        .route-item {
            flex: 0 0 190px;

            position: relative;

            text-align: center;

            z-index: 5;
        }


        .route-name {
            height: 52px;

            padding: 0 8px;

            color: #493527;

            font-size: 18px;

            font-weight: bold;

            line-height: 1.2;

            overflow-wrap: break-word;
        }


        /* =================================================
           DOT
           ================================================= */

        .route-dot {
            width: 34px;
            height: 34px;

            margin:
                16px
                auto
                16px;

            border:
                7px solid #b64b2a;

            border-radius: 50%;

            background-color: #f8efd9;

            position: relative;

            z-index: 10;
        }


        /* =================================================
           DETAILS
           ================================================= */

        .route-details {
            min-height: 92px;

            color: #70513c;

            font-size: 14px;

            line-height: 1.4;

            padding: 0 8px;
        }


        .route-details strong {
            color: #b64b2a;
        }


        .bus-symbol {
            font-size: 24px;
        }


        .walk-symbol {
            font-size: 21px;
        }


        .wait-symbol {
            font-size: 20px;
        }


        /* =================================================
           REMAINING TIME / MONEY
           ================================================= */

        .resource-left {
            margin-top: 8px;

            padding-top: 9px;

            border-top:
                1px solid #c49a6c;

            color: #70513c;

            line-height: 1.35;
        }


        .resource-label {
            font-size: 9px;

            font-weight: bold;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #8b5e3c;
        }


        .resource-value {
            font-size: 13px;

            font-weight: bold;

            color: #b64b2a;

            margin-bottom: 4px;
        }


        /* =================================================
           SUMMARY
           ================================================= */

        .summary {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 50px;

            margin-top: 25px;

            color: #493527;

            font-size: 18px;

            line-height: 1.5;
        }


        .summary strong {
            color: #b64b2a;
        }


        .totals {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 50px;

            margin-top: 20px;

            color: #493527;

            font-size: 19px;

            line-height: 1.5;
        }


        .totals strong {
            color: #b64b2a;
        }


        /* =================================================
           BUTTON
           ================================================= */

        .button {
            display: block;

            margin:
                30px
                auto
                0;

            padding:
                15px
                35px;

            border: none;

            border-radius: 6px;

            background-color: #b64b2a;

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;

            cursor: pointer;
        }


        .button:hover {
            background-color: #8f3820;
        }


        /* =================================================
           ERROR
           ================================================= */

        .error {
            text-align: center;

            color: #493527;

            font-size: 24px;

            padding: 50px;
        }


        /* =================================================
           LIVE BUS ICON
           ================================================= */

        .live-bus-icon {
            background:
                transparent !important;

            border:
                none !important;
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 800px) {

            .postcard {
                padding:
                    35px
                    20px;
            }


            h1 {
                font-size: 36px;
            }


            .subtitle {
                font-size: 17px;
            }


            .map-wrapper {
                height: 300px;
            }


            .summary,
            .totals {
                flex-direction: column;

                gap: 8px;

                align-items: center;

                text-align: center;
            }

        }

    </style>

</head>


<body>


<div class="postcard">


    <h1>
        Greetings from Scotland!
    </h1>


    <div class="subtitle">
        Your Ember Bus adventure
    </div>


    <!-- =================================================
         MAP
         ================================================= -->

    <div class="map-wrapper">

        <div id="map"></div>

    </div>


    <!-- =================================================
         ROUTE
         ================================================= -->

    <div class="route-wrapper">

        <div
            class="route"
            id="route"
        >

            <div
                class="route-arrow-line"
            ></div>

        </div>

    </div>


    <!-- =================================================
         SUMMARY
         ================================================= -->

    <div
        class="summary"
        id="summary"
    ></div>


    <div
        class="totals"
        id="totals"
    ></div>


    <button
        class="button"
        onclick="window.location.href='/'"
    >
        Plan Another Trip
    </button>


</div>


<!-- =====================================================
     LEAFLET JAVASCRIPT
     ===================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>


<script>

    /* =====================================================
       READ URL DATA
       ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    let routeData = [];

    let trips = [];

    let interests = [];

    let budget =
        params.get("budget")
        || "0";

    let maxTime =
        Number(
            params.get("max_time")
            || 0
        );


    try {

        routeData =
            JSON.parse(
                params.get("route")
                || "[]"
            );

    }
    catch (error) {

        console.error(
            "Could not parse route:",
            error
        );

    }


    try {

        trips =
            JSON.parse(
                params.get("trips")
                || "[]"
            );

    }
    catch (error) {

        console.error(
            "Could not parse trips:",
            error
        );

    }


    try {

        interests =
            JSON.parse(
                params.get("interests")
                || "[]"
            );

    }
    catch (error) {

        console.error(
            "Could not parse interests:",
            error
        );

    }


    const trip =
        trips.length > 0
            ? trips[0]
            : null;


    const unlimitedBudget =
        budget === "Unlimited";


    /* =====================================================
       FORMAT HELPERS
       ===================================================== */

    function formatTime(minutes) {

        minutes =
            Math.max(
                0,
                Math.round(
                    Number(minutes)
                    || 0
                )
            );


        const hours =
            Math.floor(
                minutes / 60
            );


        const mins =
            minutes % 60;


        if (hours === 0) {

            return `${mins} min`;

        }


        if (mins === 0) {

            return `${hours} hr`;

        }


        return (
            `${hours} hr ${mins} min`
        );

    }


    function formatMoney(value) {

        return Number(
            value || 0
        ).toFixed(2);

    }


    function formatClockTime(value) {

        if (!value) {
            return "";
        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return date.toLocaleTimeString(
            "en-GB",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    function haversineDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const earthRadius =
            6371;


        const toRadians =
            degrees =>
                degrees * Math.PI / 180;


        const dLat =
            toRadians(
                lat2 - lat1
            );


        const dLon =
            toRadians(
                lon2 - lon1
            );


        const a =
            Math.sin(
                dLat / 2
            ) ** 2

            +

            Math.cos(
                toRadians(lat1)
            )
            *
            Math.cos(
                toRadians(lat2)
            )
            *
            Math.sin(
                dLon / 2
            ) ** 2;


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return earthRadius * c;

    }


    function walkingTime(
        distanceKm
    ) {

        return (
            distanceKm
            / 5
            * 60
        );

    }


    /* =====================================================
       SUMMARY
       ===================================================== */

    document.getElementById(
        "summary"
    ).innerHTML = `

        <div>
            <strong>
                Interest:
            </strong>

            ${
                interests.join(", ")
            }
        </div>

        <div>
            <strong>
                Available Time:
            </strong>

            ${
                formatTime(maxTime)
            }
        </div>

        <div>
            <strong>
                Budget:
            </strong>

            ${
                unlimitedBudget
                    ? "£Unlimited"
                    : "£" + formatMoney(budget)
            }
        </div>

    `;


    /* =====================================================
       BUILD ROUTE
       ===================================================== */

    const route =
        document.getElementById(
            "route"
        );


    if (!trip) {

        route.innerHTML =
            `
                <div class="error">
                    No valid trip could be found.
                </div>
            `;

    }
    else {

        const itinerary = [];


        /*
         * -----------------------------------------------
         * START
         * -----------------------------------------------
         */

        const startName =
            routeData.length > 0
                ? routeData[0].name
                : "Start";


        itinerary.push({

            type:
                "start",

            name:
                startName,

            duration:
                0,

            cost:
                0

        });


        /*
         * -----------------------------------------------
         * OUTBOUND BUS
         * -----------------------------------------------
         */

        itinerary.push({

            type:
                "bus",

            name:
                `Bus to ${trip.destination}`,

            departure:
                trip.outbound.departure,

            arrival:
                trip.outbound.arrival,

            duration:
                Number(
                    trip.outbound.duration_minutes
                ),

            cost:
                Number(
                    trip.outbound.cost
                )

        });


        /*
         * -----------------------------------------------
         * DESTINATION
         * -----------------------------------------------
         */

        itinerary.push({

            type:
                "destination",

            name:
                trip.destination,

            duration:
                0,

            cost:
                0

        });


        /*
         * -----------------------------------------------
         * ATTRACTIONS
         * -----------------------------------------------
         */

        const attractionList =
            trip.attractions || [];


        attractionList.forEach(
            (
                attraction,
                index
            ) => {

                itinerary.push({

                    type:
                        "attraction",

                    name:
                        attraction.name,

                    duration:
                        Number(
                            attraction.duration_minutes
                        ),

                    cost:
                        Number(
                            attraction.cost
                        ),

                    lat:
                        Number(
                            attraction.lat
                        ),

                    lon:
                        Number(
                            attraction.lon
                        )

                });


                /*
                 * Walking leg
                 */

                if (
                    index
                    <
                    attractionList.length - 1
                ) {

                    const next =
                        attractionList[
                            index + 1
                        ];


                    const distance =
                        haversineDistance(

                            Number(
                                attraction.lat
                            ),

                            Number(
                                attraction.lon
                            ),

                            Number(
                                next.lat
                            ),

                            Number(
                                next.lon
                            )

                        );


                    itinerary.push({

                        type:
                            "walk",

                        name:
                            "Walk",

                        duration:
                            walkingTime(
                                distance
                            ),

                        distance:
                            distance,

                        cost:
                            0

                    });

                }

            }
        );


        /*
         * -----------------------------------------------
         * WAIT FOR RETURN BUS
         * -----------------------------------------------
         */

        let timeAtAttractions = 0;


        attractionList.forEach(
            (
                attraction,
                index
            ) => {

                timeAtAttractions +=
                    Number(
                        attraction.duration_minutes
                    );


                if (
                    index
                    <
                    attractionList.length - 1
                ) {

                    const next =
                        attractionList[
                            index + 1
                        ];


                    const distance =
                        haversineDistance(

                            Number(
                                attraction.lat
                            ),

                            Number(
                                attraction.lon
                            ),

                            Number(
                                next.lat
                            ),

                            Number(
                                next.lon
                            )

                        );


                    timeAtAttractions +=
                        walkingTime(
                            distance
                        );

                }

            }
        );


        const attractionFinish =
            new Date(
                trip.outbound.arrival
            );


        attractionFinish.setTime(
            attractionFinish.getTime()
            +
            timeAtAttractions
            * 60000
        );


        const returnDeparture =
            new Date(
                trip.return.departure
            );


        const waitMinutes =
            Math.max(
                0,
                (
                    returnDeparture
                    -
                    attractionFinish
                ) / 60000
            );


        if (
            waitMinutes > 0
        ) {

            itinerary.push({

                type:
                    "wait",

                name:
                    "Wait for bus",

                duration:
                    waitMinutes,

                cost:
                    0

            });

        }


        /*
         * -----------------------------------------------
         * RETURN BUS
         * -----------------------------------------------
         */

        itinerary.push({

            type:
                "bus",

            name:
                `Bus to ${startName}`,

            departure:
                trip.return.departure,

            arrival:
                trip.return.arrival,

            duration:
                Number(
                    trip.return.duration_minutes
                ),

            cost:
                Number(
                    trip.return.cost
                )

        });


        /*
         * -----------------------------------------------
         * FINISH
         * -----------------------------------------------
         */

        itinerary.push({

            type:
                "finish",

            name:
                startName,

            duration:
                0,

            cost:
                0

        });


        /*
         * -----------------------------------------------
         * ROUTE WIDTH
         * -----------------------------------------------
         */

        route.style.width =
            Math.max(
                1200,
                itinerary.length * 190
            )
            + "px";


        /*
         * -----------------------------------------------
         * RESOURCE TRACKING
         * -----------------------------------------------
         */

        let elapsedTime = 0;

        let spentMoney = 0;


        /*
         * -----------------------------------------------
         * RENDER EACH ITEM
         * -----------------------------------------------
         */

        itinerary.forEach(
            item => {

                const itemElement =
                    document.createElement(
                        "div"
                    );


                itemElement.className =
                    "route-item";


                /*
                 * NAME
                 */

                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "route-name";


                name.textContent =
                    item.name;


                /*
                 * DOT
                 */

                const dot =
                    document.createElement(
                        "div"
                    );


                dot.className =
                    "route-dot";


                /*
                 * DETAILS
                 */

                const details =
                    document.createElement(
                        "div"
                    );


                details.className =
                    "route-details";


                if (
                    item.type === "start"
                ) {

                    details.innerHTML = `
                        <strong>
                            Start
                        </strong>
                    `;

                }


                else if (
                    item.type === "destination"
                ) {

                    details.innerHTML = `
                        <strong>
                            Destination
                        </strong>
                    `;

                }


                else if (
                    item.type === "attraction"
                ) {

                    const costText =
                        item.cost === 0
                            ? "Free"
                            : `£${formatMoney(
                                item.cost
                            )}`;


                    details.innerHTML = `

                        <strong>
                            ${costText}
                        </strong>

                        <br>

                        ${
                            formatTime(
                                item.duration
                            )
                        }

                    `;

                }


                else if (
                    item.type === "walk"
                ) {

                    details.innerHTML = `

                        <strong>
                            Walk
                        </strong>

                        <br>

                        ${
                            formatTime(
                                item.duration
                            )
                        }

                        <br>

                        ${
                            item.distance.toFixed(2)
                        }
                        km

                    `;

                }


                else if (
                    item.type === "wait"
                ) {

                    details.innerHTML = `

                        <span class="wait-symbol">
                            ⏱
                        </span>

                        <strong>
                            Wait
                        </strong>

                        <br>

                        ${
                            formatTime(
                                item.duration
                            )
                        }

                    `;

                }


                else if (
                    item.type === "bus"
                ) {

                    details.innerHTML = `

                        <br>

                        <strong>
                            ${
                                formatClockTime(
                                    item.departure
                                )
                            }

                            →

                            ${
                                formatClockTime(
                                    item.arrival
                                )
                            }
                        </strong>

                        <br>

                        ${
                            formatTime(
                                item.duration
                            )
                        }

                        <br>

                        £${formatMoney(
                            item.cost
                        )}

                    `;

                }


                else if (
                    item.type === "finish"
                ) {

                    details.innerHTML = `
                        <strong>
                            Finish
                        </strong>
                    `;

                }


                /*
                 * -----------------------------------------
                 * UPDATE TIME
                 * -----------------------------------------
                 */

                elapsedTime +=
                    Number(
                        item.duration || 0
                    );


                /*
                 * -----------------------------------------
                 * UPDATE MONEY
                 * -----------------------------------------
                 */

                if (
                    item.type === "bus"
                    ||
                    item.type === "attraction"
                ) {

                    spentMoney +=
                        Number(
                            item.cost || 0
                        );

                }


                /*
                 * -----------------------------------------
                 * REMAINING
                 * -----------------------------------------
                 */

                const remainingTime =
                    Math.max(
                        0,
                        maxTime - elapsedTime
                    );


                const remainingMoney =
                    unlimitedBudget
                        ? null
                        : Math.max(
                            0,
                            Number(budget)
                            - spentMoney
                        );


                const resources =
                    document.createElement(
                        "div"
                    );


                resources.className =
                    "resource-left";


                resources.innerHTML = `

                    <div class="resource-label">
                        Time Left
                    </div>

                    <div class="resource-value">
                        ${
                            formatTime(
                                remainingTime
                            )
                        }
                    </div>

                    <div class="resource-label">
                        Money Left
                    </div>

                    <div class="resource-value">
                        ${
                            unlimitedBudget
                                ? "£Unlimited"
                                : "£"
                                  + formatMoney(
                                      remainingMoney
                                    )
                        }
                    </div>

                `;


                /*
                 * -----------------------------------------
                 * APPEND
                 * -----------------------------------------
                 */

                itemElement.appendChild(
                    name
                );

                itemElement.appendChild(
                    dot
                );

                itemElement.appendChild(
                    details
                );

                itemElement.appendChild(
                    resources
                );

                route.appendChild(
                    itemElement
                );

            }
        );


        /*
         * -----------------------------------------------
         * TOTALS
         * -----------------------------------------------
         */

        const totalTime =
            Number(
                trip.total_time_minutes
                || 0
            );


        const totalCost =
            Number(
                trip.total_cost
                || 0
            );


        const timeLeft =
            Math.max(
                0,
                maxTime - totalTime
            );


        const costLeft =
            unlimitedBudget
                ? null
                : Math.max(
                    0,
                    Number(budget)
                    - totalCost
                );


        document.getElementById(
            "totals"
        ).innerHTML = `

            <div>
                <strong>
                    Total Time:
                </strong>

                ${
                    formatTime(
                        totalTime
                    )
                }
            </div>

            <div>
                <strong>
                    Time Left:
                </strong>

                ${
                    formatTime(
                        timeLeft
                    )
                }
            </div>

            <div>
                <strong>
                    Total Cost:
                </strong>

                £${
                    formatMoney(
                        totalCost
                    )
                }
            </div>

            <div>
                <strong>
                    Cost Left:
                </strong>

                ${
                    unlimitedBudget
                        ? "£Unlimited"
                        : "£"
                          + formatMoney(
                              costLeft
                            )
                }
            </div>

        `;

    }


    /* =====================================================
       MAP
       ===================================================== */

    const map =
        L.map(
            "map",
            {
                zoomControl:
                    true,

                attributionControl:
                    true
            }
        );


    /*
     * Start with Scotland.
     */

    map.setView(
        [
            56.4907,
            -4.2026
        ],
        7
    );


    /*
     * Use the standard OpenStreetMap tile endpoint.
     */

    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            minZoom: 3,

            maxZoom: 19,

            tileSize: 256,

            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }
    ).addTo(
        map
    );


    /*
     * Give Leaflet several opportunities to calculate
     * the final container size.
     */

    function refreshMap() {

        map.invalidateSize({
            pan: false
        });

    }


    refreshMap();


    setTimeout(
        refreshMap,
        100
    );


    setTimeout(
        refreshMap,
        500
    );


    setTimeout(
        refreshMap,
        1000
    );


    window.addEventListener(
        "resize",
        refreshMap
    );


    /*
     * Plot attraction markers.
     */

    const mapPoints = [];


    if (trip) {

        const attractions =
            trip.attractions
            || [];


        attractions.forEach(
            (
                attraction,
                index
            ) => {

                const lat =
                    Number(
                        attraction.lat
                    );


                const lon =
                    Number(
                        attraction.lon
                    );


                if (
                    Number.isNaN(lat)
                    ||
                    Number.isNaN(lon)
                ) {

                    return;

                }


                const marker =
                    L.marker(
                        [
                            lat,
                            lon
                        ]
                    ).addTo(
                        map
                    );


                marker.bindPopup(
                    `
                    <strong>
                        ${attraction.name}
                    </strong>

                    <br><br>

                    ${
                        Number(
                            attraction.cost
                        ) === 0
                            ? "Free"
                            : "£"
                              + formatMoney(
                                  attraction.cost
                                )
                    }

                    <br>

                    ${
                        formatTime(
                            attraction.duration_minutes
                        )
                    }
                    `
                );


                mapPoints.push(
                    [
                        lat,
                        lon
                    ]
                );

            }
        );

    }


    /*
     * Draw walking route between attractions.
     */

    if (
        mapPoints.length > 1
    ) {

        const walkingLine =
            L.polyline(
                mapPoints,
                {
                    color:
                        "#b64b2a",

                    weight:
                        4,

                    opacity:
                        0.8
                }
            ).addTo(
                map
            );


        map.fitBounds(
            walkingLine.getBounds(),
            {
                padding:
                    [
                        40,
                        40
                    ]
            }
        );

    }
    else if (
        mapPoints.length === 1
    ) {

        map.setView(
            mapPoints[0],
            14
        );

    }


    /*
     * Recalculate after fitting the route.
     */

    setTimeout(
        refreshMap,
        100
    );


    setTimeout(
        refreshMap,
        500
    );


    /* =====================================================
       LIVE BUSES
       ===================================================== */

    const liveBusMarkers = {};


    async function updateLiveBuses() {

        try {

            const response =
                await fetch(
                    "/api/live-vehicles"
                );


            if (!response.ok) {

                return;

            }


            const buses =
                await response.json();


            if (
                !Array.isArray(buses)
            ) {

                return;

            }


            buses.forEach(
                bus => {

                    const id =
                        bus.id;


                    const lat =
                        Number(
                            bus.lat
                        );


                    const lon =
                        Number(
                            bus.lon
                        );


                    const bearing =
                        Number(
                            bus.bearing || 0
                        );


                    const tripName =
                        bus.trip_name
                        ||
                        "Active Route";


                    if (
                        !Number.isFinite(lat)
                        ||
                        !Number.isFinite(lon)
                    ) {

                        return;

                    }


                    const busIcon =
                        L.divIcon({

                            className:
                                "live-bus-icon",

                            html: `
                                <div
                                    style="
                                        width: 36px;
                                        height: 36px;

                                        border-radius: 50%;

                                        background: #b64b2a;

                                        color: white;

                                        border: 2px solid white;

                                        display: flex;

                                        align-items: center;

                                        justify-content: center;

                                        font-size: 17px;

                                        box-shadow:
                                            0 3px 6px
                                            rgba(
                                                0,
                                                0,
                                                0,
                                                0.3
                                            );

                                        transform:
                                            rotate(
                                                ${bearing}deg
                                            );
                                    "
                                >
                                </div>
                            `,

                            iconSize:
                                [
                                    36,
                                    36
                                ],

                            iconAnchor:
                                [
                                    18,
                                    18
                                ]

                        });


                    if (
                        liveBusMarkers[id]
                    ) {

                        liveBusMarkers[id]
                            .setLatLng(
                                [
                                    lat,
                                    lon
                                ]
                            );

                        liveBusMarkers[id]
                            .setIcon(
                                busIcon
                            );

                    }
                    else {

                        const marker =
                            L.marker(
                                [
                                    lat,
                                    lon
                                ],
                                {
                                    icon:
                                        busIcon
                                }
                            ).addTo(
                                map
                            );


                        marker.bindPopup(
                            `
                            <strong>
                                Bus
                            </strong>

                            <br>

                            ID:
                            ${id}

                            <br>

                            Trip:
                            ${tripName}
                            `
                        );


                        liveBusMarkers[id] =
                            marker;

                    }

                }
            );

        }
        catch (error) {

            console.error(
                "Live bus update failed:",
                error
            );

        }

    }


    /*
     * Live bus updates are optional. If the endpoint
     * isn't available, the rest of the map still works.
     */

    updateLiveBuses();


    setInterval(
        updateLiveBuses,
        8000
    );

</script>

</body>

</html>
