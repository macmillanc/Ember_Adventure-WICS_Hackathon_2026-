<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Ember Bus Route</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #d6bea0;

            font-family: Georgia, "Times New Roman", serif;
        }

        .postcard {
            width: 96%;
            max-width: 1500px;

            min-height: 800px;

            background-color: #f8efd9;

            border: 14px solid white;
            outline: 3px solid #8b5e3c;

            padding: 65px;

            box-shadow:
                15px 15px 30px rgba(0, 0, 0, 0.25);

            position: relative;
        }

        .postcard::before {
            content: "";

            position: absolute;

            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;

            border: 3px dashed #c49a6c;

            pointer-events: none;
        }

        h1 {
            text-align: center;

            font-size: 55px;

            color: #b64b2a;

            margin: 10px 0 5px;

            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;

            font-size: 22px;

            color: #70513c;

            margin-bottom: 100px;
        }


        /* ROUTE */

        .route-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px 50px 35px 10px;
            -webkit-overflow-scrolling: touch;
        }

        .route {
            min-width: 1100px;
            width: max-content;
            position: relative;

            display: flex;
            align-items: flex-start;

            padding: 0 50px 0 30px;
        }

        /* LINE */

        .route-line {
            position: absolute;

            left: 30px;
            right: 50px;

            top: 85px;

            height: 10px;

            background-color: #b64b2a;

            border-radius: 10px;
        }

        .route-line::after {
            content: "";

            position: absolute;

            right: -35px;

            top: -15px;

            width: 0;
            height: 0;

            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;

            border-left: 40px solid #b64b2a;
        }


        /* ROUTE ITEMS */

        .route-item {
            position: relative;

            flex: 1;

            min-width: 150px;

            text-align: center;

            z-index: 5;
        }

        .route-name {
            min-height: 50px;

            padding: 0 8px;

            font-size: 19px;

            font-weight: bold;

            color: #493527;
        }


        /* STOP */

        .stop {
            width: 34px;
            height: 34px;

            margin: 18px auto 18px;

            background-color: #f8efd9;

            border: 7px solid #b64b2a;

            border-radius: 50%;
        }


        /* DETAILS */

        .route-detail {
            min-height: 75px;

            padding: 0 6px;

            font-size: 14px;

            line-height: 1.4;

            color: #70513c;
        }

        .route-detail strong {
            color: #b64b2a;
        }


        /* BUS */

        .bus-icon {
            font-size: 24px;
        }


        /* TRIP INFORMATION */

        .trip-info {
            margin-top: 45px;

            display: flex;

            justify-content: center;

            gap: 55px;

            flex-wrap: wrap;

            font-size: 19px;

            color: #493527;
        }

        .trip-info strong {
            color: #b64b2a;
        }


        /* REMAINING */

        .remaining-info {
            margin-top: 25px;

            display: flex;

            justify-content: center;

            gap: 55px;

            flex-wrap: wrap;

            font-size: 20px;

            color: #493527;
        }

        .remaining-info strong {
            color: #b64b2a;
        }


        /* ERROR */

        .error {
            text-align: center;

            font-size: 24px;

            color: #493527;

            padding: 50px;
        }


        /* BUTTON */

        button {
            display: block;

            margin: 45px auto 0;

            padding: 15px 35px;

            background-color: #b64b2a;

            color: white;

            border: none;

            border-radius: 6px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 18px;

            cursor: pointer;
        }

        button:hover {
            background-color: #8f3820;
        }


        @media (max-width: 800px) {

            .postcard {
                padding: 40px 25px;
            }

            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 18px;
                margin-bottom: 70px;
            }

        }

    </style>

</head>


<body>

<div class="postcard">

    <h1>Greetings from Scotland!</h1>

    <p class="subtitle">
        Your Ember Bus adventure
    </p>


    <div class="route-container">

        <div
            class="route"
            id="route"
        >

            <div class="route-line"></div>

        </div>

    </div>


    <div class="trip-info">

        <div>
            <strong>Interest:</strong>
            <span id="interest"></span>
        </div>

        <div>
            <strong>Available Time:</strong>
            <span id="available-time"></span>
        </div>

        <div>
            <strong>Budget:</strong>
            <span id="budget"></span>
        </div>

    </div>


    <div class="remaining-info">

        <div>
            <strong>Total Time:</strong>
            <span id="time-used"></span>
        </div>

        <div>
            <strong>Time Left:</strong>
            <span id="time-left"></span>
        </div>

        <div>
            <strong>Total Cost:</strong>
            <span id="cost-used"></span>
        </div>

        <div>
            <strong>Cost Left:</strong>
            <span id="cost-left"></span>
        </div>

    </div>


    <button onclick="window.location.href='index.html'">
        Plan Another Trip
    </button>

</div>


<script>

    /*
     * GET DATA FROM PYTHON
     */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const routeData =
        JSON.parse(
            params.get("route") || "[]"
        );

    const trips =
        JSON.parse(
            params.get("trips") || "[]"
        );

    const interests =
        JSON.parse(
            params.get("interests") || "[]"
        );

    const budgetValue =
        params.get("budget") || "0";

    const maxTime =
        Number(
            params.get("max_time") || "0"
        );


    /*
     * BEST TRIP
     */

    const trip =
        trips.length > 0
            ? trips[0]
            : null;


    /*
     * FORMAT TIME
     */

    function formatTime(minutes) {

        minutes =
            Math.max(
                0,
                Math.round(
                    Number(minutes) || 0
                )
            );

        const hours =
            Math.floor(minutes / 60);

        const mins =
            minutes % 60;

        if (hours === 0) {
            return `${mins} min`;
        }

        if (mins === 0) {
            return `${hours} hr`;
        }

        return `${hours} hr ${mins} min`;
    }


    /*
     * FORMAT MONEY
     */

    function formatMoney(value) {

        return Number(value || 0)
            .toFixed(2);
    }


    /*
     * FORMAT CLOCK TIME
     */

    function formatClockTime(value) {

        if (!value) {
            return "";
        }

        const date =
            new Date(value);

        return date.toLocaleTimeString(
            "en-GB",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    /*
     * HAVERSINE DISTANCE
     */

    function haversineDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const earthRadius = 6371;

        const toRadians =
            degrees =>
                degrees * Math.PI / 180;

        const dLat =
            toRadians(lat2 - lat1);

        const dLon =
            toRadians(lon2 - lon1);

        const latitude1 =
            toRadians(lat1);

        const latitude2 =
            toRadians(lat2);

        const a =
            Math.sin(dLat / 2) ** 2
            +
            Math.cos(latitude1)
            * Math.cos(latitude2)
            * Math.sin(dLon / 2) ** 2;

        const c =
            2 * Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

        return earthRadius * c;
    }


    /*
     * WALKING TIME
     */

    function walkingTime(distanceKm) {

        const walkingSpeed = 5;

        return (
            distanceKm
            / walkingSpeed
            * 60
        );
    }


    /*
     * BASIC INFORMATION
     */

    document.getElementById(
        "interest"
    ).textContent =
        interests.join(", ");


    document.getElementById(
        "available-time"
    ).textContent =
        formatTime(maxTime);


    /*
     * BUDGET
     */

    const unlimitedBudget =
        budgetValue === "Unlimited";


    document.getElementById(
        "budget"
    ).textContent =
        unlimitedBudget
            ? "£Unlimited"
            : "£" + formatMoney(
                budgetValue
            );


    /*
     * ROUTE CONTAINER
     */

    const route =
        document.getElementById(
            "route"
        );


    /*
     * CREATE AN ITINERARY
     */

    if (!trip) {

        route.innerHTML =
            `
            <div class="error">
                No route could be found.
            </div>
            `;

    }
    else {

        const itinerary = [];


        /*
         * START
         */

        itinerary.push({
            type: "start",
            name:
                routeData.length > 0
                    ? routeData[0].name
                    : "Start"
        });


        /*
         * OUTBOUND BUS
         */

        itinerary.push({
            type: "bus",
            name:
                `Bus to ${trip.destination}`,

            departure:
                trip.outbound.departure,

            arrival:
                trip.outbound.arrival,

            duration:
                trip.outbound.duration_minutes,

            cost:
                trip.outbound.cost
        });


        /*
         * DESTINATION HUB
         */

        itinerary.push({
            type: "destination",
            name: trip.destination
        });


        /*
         * ATTRACTIONS + WALKING
         */

        const attractionList =
            trip.attractions || [];


        attractionList.forEach(
            (attraction, index) => {

                itinerary.push({
                    type: "attraction",
                    name: attraction.name,
                    duration:
                        attraction.duration_minutes,
                    cost:
                        attraction.cost,
                    lat:
                        attraction.lat,
                    lon:
                        attraction.lon
                });


                /*
                 * ADD WALKING LEG BETWEEN
                 * THIS ATTRACTION AND THE NEXT
                 */

                if (
                    index <
                    attractionList.length - 1
                ) {

                    const nextAttraction =
                        attractionList[
                            index + 1
                        ];

                    const distance =
                        haversineDistance(
                            attraction.lat,
                            attraction.lon,
                            nextAttraction.lat,
                            nextAttraction.lon
                        );

                    const walkTime =
                        walkingTime(
                            distance
                        );

                    itinerary.push({
                        type: "walk",
                        name: "Walk",
                        duration: walkTime,
                        distance: distance
                    });

                }

            }
        );


        /*
         * RETURN BUS
         */

        itinerary.push({
            type: "bus",
            name:
                `Bus to ${routeData[0]?.name || "Start"}`,

            departure:
                trip.return.departure,

            arrival:
                trip.return.arrival,

            duration:
                trip.return.duration_minutes,

            cost:
                trip.return.cost
        });


        /*
         * FINISH
         */

        itinerary.push({
            type: "finish",
            name:
                routeData[0]?.name || "Start"
        });


        /*
         * SET WIDTH BASED ON NUMBER OF ITEMS
         */
        route.style.width =
            Math.max(
                1100,
                itinerary.length * 175
            ) + "px";

        /*
         * CREATE ROUTE ITEMS
         */

        itinerary.forEach(
            item => {

                const routeItem =
                    document.createElement(
                        "div"
                    );

                routeItem.className =
                    "route-item";


                /*
                 * NAME
                 */

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "route-name";

                name.textContent =
                    item.name;


                /*
                 * STOP
                 */

                const stop =
                    document.createElement(
                        "div"
                    );

                stop.className =
                    "stop";


                /*
                 * DETAILS
                 */

                const detail =
                    document.createElement(
                        "div"
                    );

                detail.className =
                    "route-detail";


                if (item.type === "start") {

                    detail.innerHTML =
                        `<strong>
                            Start
                        </strong>`;

                }
                else if (
                    item.type === "destination"
                ) {

                    detail.innerHTML =
                        `<strong>
                            Destination
                        </strong>`;

                }
                else if (
                    item.type === "attraction"
                ) {

                    const costText =
                        Number(item.cost) === 0
                            ? "Free"
                            : `£${formatMoney(
                                item.cost
                            )}`;

                    detail.innerHTML =
                        `<strong>
                            ${costText}
                        </strong>
                        <br>
                        ${formatTime(
                            item.duration
                        )}`;

                }
                else if (
                    item.type === "walk"
                ) {

                    detail.innerHTML =
                        `<strong>
                            🚶 Walk
                        </strong>
                        <br>
                        ${formatTime(
                            item.duration
                        )}
                        <br>
                        ${item.distance.toFixed(2)}
                        km`;

                }
                else if (
                    item.type === "bus"
                ) {

                    detail.innerHTML =
                        `
                        <span class="bus-icon">
                            🚌
                        </span>
                        <br>

                        <strong>
                            ${formatClockTime(
                                item.departure
                            )}
                            →
                            ${formatClockTime(
                                item.arrival
                            )}
                        </strong>

                        <br>

                        ${formatTime(
                            item.duration
                        )}

                        <br>

                        £${formatMoney(
                            item.cost
                        )}
                        `;

                }
                else if (
                    item.type === "finish"
                ) {

                    detail.innerHTML =
                        `<strong>
                            Finish
                        </strong>`;

                }


                /*
                 * ADD TO ROUTE
                 */

                routeItem.appendChild(name);

                routeItem.appendChild(stop);

                routeItem.appendChild(detail);

                route.appendChild(routeItem);

            }
        );

    }


    /*
     * TOTALS
     */

    if (trip) {

        const totalTime =
            Number(
                trip.total_time_minutes || 0
            );

        const totalCost =
            Number(
                trip.total_cost || 0
            );


        /*
         * TIME LEFT
         */

        const timeLeft =
            Math.max(
                0,
                maxTime - totalTime
            );


        /*
         * COST LEFT
         */

        let costLeft = 0;

        if (!unlimitedBudget) {

            costLeft =
                Math.max(
                    0,
                    Number(budgetValue)
                    - totalCost
                );

        }


        /*
         * DISPLAY
         */

        document.getElementById(
            "time-used"
        ).textContent =
            formatTime(totalTime);


        document.getElementById(
            "time-left"
        ).textContent =
            formatTime(timeLeft);


        document.getElementById(
            "cost-used"
        ).textContent =
            "£" + formatMoney(
                totalCost
            );


        document.getElementById(
            "cost-left"
        ).textContent =
            unlimitedBudget
                ? "£Unlimited"
                : "£" + formatMoney(
                    costLeft
                );

    }
    else {

        document.getElementById(
            "time-used"
        ).textContent =
            "N/A";

        document.getElementById(
            "time-left"
        ).textContent =
            "N/A";

        document.getElementById(
            "cost-used"
        ).textContent =
            "N/A";

        document.getElementById(
            "cost-left"
        ).textContent =
            "N/A";

    }

</script>

</body>

</html>
