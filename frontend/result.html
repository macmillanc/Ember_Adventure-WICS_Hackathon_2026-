<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Ember Bus Route</title>

    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            background-color: #d6bea0;

            font-family: Georgia, "Times New Roman", serif;
        }


        .postcard {

            width: 96%;
            max-width: 1450px;

            min-height: 750px;

            background-color: #f8efd9;

            border: 14px solid white;

            outline: 3px solid #8b5e3c;

            padding: 45px 65px;

            box-shadow:
                15px 15px 30px rgba(0, 0, 0, 0.25);

            position: relative;
        }


        .postcard::before {

            content: "";

            position: absolute;

            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;

            border: 3px dashed #c49a6c;

            pointer-events: none;
        }


        h1 {

            text-align: center;

            font-size: 45px;

            color: #b64b2a;

            margin: 10px 0 5px;

            letter-spacing: 3px;
        }


        .subtitle {

            text-align: center;

            font-size: 18px;

            color: #70513c;

            margin-bottom: 30px;
        }


        /* MAP CONTAINER */

        #map {
            width: 100%;
            height: 350px;
            border: 4px solid #8b5e3c;
            border-radius: 8px;
            margin-bottom: 35px;
            z-index: 10;
        }


        /* ROUTE */

        .route-container {

            width: 100%;

            overflow-x: auto;

            padding-bottom: 20px;
        }


        .route {

            width: 100%;

            min-width: 850px;

            position: relative;

            height: 150px;
        }


        /* ARROW */

        .arrow {

            position: absolute;

            left: 0;
            right: 45px;

            top: 75px;

            height: 10px;

            background-color: #b64b2a;

            border-radius: 10px;
        }


        .arrow::after {

            content: "";

            position: absolute;

            right: -45px;

            top: -15px;

            width: 0;
            height: 0;

            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;

            border-left: 50px solid #b64b2a;
        }


        /* DESTINATION NAMES */

        .destinations {

            position: absolute;

            left: 0;
            right: 0;

            top: 0;

            display: grid;

            z-index: 5;
        }


        .destination {

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            color: #493527;

            padding: 0 10px;

            overflow-wrap: break-word;
        }


        /* CIRCLES */

        .stops {

            position: absolute;

            left: 0;
            right: 45px;

            top: 63px;

            display: grid;

            z-index: 10;
        }


        .stop {

            width: 34px;
            height: 34px;

            justify-self: center;

            background-color: #f8efd9;

            border: 7px solid #b64b2a;

            border-radius: 50%;
        }


        /* TRIP INFORMATION */

        .trip-info {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 100px;

            font-size: 21px;

            color: #493527;
        }


        .trip-info strong {

            color: #b64b2a;
        }


        /* BUTTON */

        button {

            display: block;

            margin: 30px auto 0;

            padding: 15px 35px;

            background-color: #b64b2a;

            color: white;

            border: none;

            border-radius: 6px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 18px;

            cursor: pointer;
        }


        button:hover {

            background-color: #8f3820;
        }


        @media (max-width: 800px) {

            .postcard {

                padding: 40px 25px;
            }


            h1 {

                font-size: 38px;
            }


            .subtitle {

                font-size: 18px;

                margin-bottom: 20px;
            }


            .destination {

                font-size: 18px;
            }


            .trip-info {

                flex-direction: column;

                gap: 10px;

                text-align: center;
            }

        }

    </style>
</head>

<body>

    <div class="postcard">
        <h1>Your Ember Bus Route</h1>
        <div class="subtitle">Custom journey plan tailored to your trip</div>

        <!-- OpenStreetMap Container -->
        <div id="map"></div>

        <!-- Route Visual Container -->
        <div class="route-container">
            <div class="route">
                <div class="arrow"></div>
                <div class="destinations" id="destinations"></div>
                <div class="stops" id="stops"></div>
            </div>
        </div>

        <!-- Trip Information Summary -->
        <div class="trip-info" id="trip-info">
            <!-- Populated via JavaScript -->
        </div>

        <button onclick="window.location.href='/'">Plan Another Trip</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // 1. Parse URL parameters sent from Flask
        const urlParams = new URLSearchParams(window.location.search);
        const routeData = JSON.parse(urlParams.get('route') || '[]');
        const budget = urlParams.get('budget');
        const maxTime = urlParams.get('max_time');

        // 2. Render Trip Stats
        const hours = Math.floor(maxTime / 60);
        const minutes = maxTime % 60;
        const timeFormatted = hours > 0 ? `${hours} hr ${minutes} min` : `${minutes} min`;

        document.getElementById('trip-info').innerHTML = `
            <div>Budget: <strong>${budget === 'Unlimited' ? 'Unlimited' : '£' + budget}</strong></div>
            <div>Max Time: <strong>${timeFormatted}</strong></div>
            <div>Stops: <strong>${routeData.length} locations</strong></div>
        `;

        // 3. Render Route Visual Elements (Destinations & Stops Grid)
        if (routeData.length > 0) {
            const destContainer = document.getElementById('destinations');
            const stopsContainer = document.getElementById('stops');
            
            destContainer.style.gridTemplateColumns = `repeat(${routeData.length}, 1fr)`;
            stopsContainer.style.gridTemplateColumns = `repeat(${routeData.length}, 1fr)`;

            routeData.forEach((stop, index) => {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'destination';
                nameDiv.style.gridColumn = index + 1;
                nameDiv.textContent = stop.name || stop;
                destContainer.appendChild(nameDiv);

                const stopDiv = document.createElement('div');
                stopDiv.className = 'stop';
                stopDiv.style.gridColumn = index + 1;
                stopsContainer.appendChild(stopDiv);
            });
        }

        // 4. Initialize Leaflet OpenStreetMap
        const map = L.map('map').setView([56.4907, -4.2026], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 5. Plot Route Stops & Live Buses
        const latLngs = [];
        if (routeData.length > 0) {
            routeData.forEach((stop, index) => {
                if (stop.lat && stop.lon) {
                    const marker = L.marker([stop.lat, stop.lon]).addTo(map);
                    marker.bindPopup(`<b>Stop ${index + 1}:</b> ${stop.name}`);
                    latLngs.push([stop.lat, stop.lon]);
                }
            });

            if (latLngs.length > 1) {
                const polyline = L.polyline(latLngs, { color: '#b64b2a', weight: 4 }).addTo(map);
                map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
            } else if (latLngs.length === 1) {
                map.setView(latLngs[0], 12);
            }
        }

        // 6. Live Bus Polling
        let liveBusMarkers = {};

        async function updateLiveBuses() {
            try {
                const response = await fetch('/api/live-vehicles');
                const buses = await response.json();

                if (!Array.isArray(buses)) return;

                buses.forEach(bus => {
                    const { id, lat, lon, bearing, trip_name } = bus;

                    const busIcon = L.divIcon({
                        className: 'live-bus-marker',
                        html: `
                            <div style="
                                transform: rotate(${bearing || 0}deg);
                                background-color: #b64b2a;
                                color: white;
                                width: 36px;
                                height: 36px;
                                border-radius: 50%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: 16px;
                                border: 2px solid white;
                                box-shadow: 0 3px 6px rgba(0,0,0,0.3);
                                transition: all 1s linear;
                            ">🚌</div>
                        `,
                        iconSize: [36, 36],
                        iconAnchor: [18, 18]
                    });

                    if (liveBusMarkers[id]) {
                        liveBusMarkers[id].setLatLng([lat, lon]);
                        liveBusMarkers[id].setIcon(busIcon);
                    } else {
                        const marker = L.marker([lat, lon], { icon: busIcon }).addTo(map);
                        marker.bindPopup(`<b>Bus ID:</b> ${id}<br><b>Trip:</b> ${trip_name || 'Active Route'}`);
                        liveBusMarkers[id] = marker;
                    }
                });
            } catch (err) {
                console.error("Failed to fetch live bus locations:", err);
            }
        }

        setInterval(updateLiveBuses, 8000);
        updateLiveBuses();
    </script>
</body>

</html>
