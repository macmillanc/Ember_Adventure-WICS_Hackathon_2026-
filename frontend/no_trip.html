<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>No Valid Trip Found</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: #d6bea0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        .postcard {

            width: 90%;

            max-width: 900px;

            min-height: 500px;

            background-color: #f3f5f3;

            border: 14px solid white;

            outline: 3px solid #8b5e3c;

            padding: 70px;

            box-shadow:
                15px 15px 30px
                rgba(0, 0, 0, 0.25);

            position: relative;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }


        .postcard::before {

            content: "";

            position: absolute;

            top: 25px;

            left: 25px;

            right: 25px;

            bottom: 25px;

            border:
                3px dashed #71c7a3;

            pointer-events: none;
        }


        .icon {

            font-size: 70px;

            margin-bottom: 20px;
        }


        h1 {

            font-size: 50px;

            color: #e8587a;

            margin: 0 0 15px;

            letter-spacing: 2px;
        }


        .subtitle {

            font-size: 22px;

            color: #70513c;

            margin-bottom: 30px;

            max-width: 650px;

            line-height: 1.5;
        }


        .reason {

            background-color: #efe1c5;

            border: 2px solid #c49a6c;

            border-radius: 8px;

            padding: 20px 30px;

            max-width: 700px;

            font-size: 18px;

            line-height: 1.5;

            color: #493527;

            margin-bottom: 35px;
        }


        .tip {

            font-size: 16px;

            color: #70513c;

            margin-bottom: 30px;
        }


        button {

            padding:
                15px
                35px;

            background-color:
                #b64b2a;

            color: white;

            border: none;

            border-radius: 6px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;

            cursor: pointer;
        }


        button:hover {

            background-color:
                #8f3820;
        }


        @media (max-width: 800px) {

            .postcard {

                padding:
                    50px
                    25px;
            }


            h1 {

                font-size: 38px;
            }


            .subtitle {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>

<div class="postcard">




    <h1>
        No Trip Found
    </h1>


    <div class="subtitle">
        We couldn't find a journey that
        fits all of your requirements.
    </div>


    <div
        class="reason"
        id="reason"
    >
        No valid trip could be found.
    </div>


    <div class="tip">
        Try increasing your available time,
        increasing your budget, or selecting
        different interests.
    </div>


    <button
        onclick="window.location.href='/'"
    >
        Plan Another Trip
    </button>


</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const reason =
        params.get("reason");


    if (reason) {

        document.getElementById(
            "reason"
        ).textContent =
            reason;

    }

</script>

</body>

</html>
