<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ember</title>

    <style>
        /* Ember Bus Company - Loading Screen */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;

            background-color: #f5efe6;
            color: #292522;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Loading page */
        .loading-page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* --------------------------------
           EMBER WORDMARK
        -------------------------------- */

        .logo {
            font-size: 46px;
            font-weight: bold;
            letter-spacing: -2px;

            color: #c94b2c;

            margin-bottom: 70px;
        }

        .logo-dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            margin-left: 4px;

            border-radius: 50%;

            background-color: #c94b2c;
        }


        /* --------------------------------
           MAIN MESSAGE
        -------------------------------- */

        .message {
            font-size: 24px;
            font-weight: bold;

            color: #292522;

            margin-bottom: 32px;
        }


        /* --------------------------------
           LOADING LOOP
        -------------------------------- */

        .loader {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            border: 5px solid #d8d0c7;
            border-top-color: #c94b2c;

            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* --------------------------------
           SUBTEXT
        -------------------------------- */

        .subtext {
            margin-top: 24px;

            font-size: 15px;

            color: #5c554f;
        }


        /* --------------------------------
           BRAND ACCENT
        -------------------------------- */

        .accent {
            width: 44px;
            height: 3px;

            margin-top: 44px;

            border-radius: 999px;

            background-color: #c94b2c;
        }


        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .logo {
                font-size: 38px;
                margin-bottom: 55px;
            }

            .message {
                font-size: 20px;
            }

            .loader {
                width: 46px;
                height: 46px;
            }
        }
    </style>
</head>

<body>

    <main class="loading-page">

        <div class="logo">
            ember<span class="logo-dot"></span>
        </div>

        <div class="message">
            Planning your journey
        </div>

        <div class="loader"></div>

        <div class="subtext">
            Finding the best way to explore Scotland
        </div>

        <div class="accent"></div>

    </main>

</body>
</html>
