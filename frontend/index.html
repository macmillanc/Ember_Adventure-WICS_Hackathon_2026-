<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">

    <title>Ember Bus Epic Tour Guide</title>
</head>

<body>

    <h1>Ember Bus Tour Guide</h1>

    <p>
        Tell us a little about your trip and we'll help you plan your journey.
    </p>

    <form action="/plan" method="GET">

        <!-- Starting position -->

        <label for="starting-position">
            <strong>Starting position</strong>
        </label>

        <select
            id="starting-position"
            name="starting-position"
            required
        >
            <option value="" disabled selected>
                Select a location
            </option>

            <option value="Aberdeen">Aberdeen</option>
            <option value="Dundee">Dundee</option>
            <option value="Edinburgh">Edinburgh</option>
            <option value="Glasgow">Glasgow</option>
            <option value="Perth">Perth</option>
        </select>


        <!-- Budget -->

        <label for="budget">
            <strong>Maximum budget (£)</strong>
        </label>

        <input
            type="number"
            id="budget"
            name="budget"
            min="0"
            step="0.01"
            placeholder="e.g. 50"
        >

        <label class="checkbox-label">
            <input
                type="checkbox"
                id="unlimited-budget"
                name="unlimited-budget"
                value="true"
            >
            Unlimited budget
        </label>


        <!-- Maximum trip time -->

        <label for="max-time">
            <strong>Maximum trip time (hours)</strong>
        </label>

        <input
            type="number"
            id="max-time"
            name="max-time"
            min="1"
            step="0.5"
            placeholder="e.g. 8"
            required
        >


        <!-- Interests -->

        <label for="interests">
            <strong>What are you interested in?</strong>
        </label>

        <select
            id="interests"
            name="interests"
            multiple
            required
        >
            <option value="Beaches">Beaches</option>
            <option value="History">History</option>
            <option value="Food">Food</option>
            <option value="Hiking">Hiking</option>
            <option value="Nature">Nature</option>
            <option value="Shopping">Shopping</option>
            <option value="Art">Art</option>
            <option value="Culture">Culture</option>
            <option value="Science">Science</option>
            <option value="Architecture">Architecture</option>
            <option value="Views">Views</option>
            <option value="Walking">Walking</option>
        </select>


        <button type="submit">
            Plan My Tour
        </button>

    </form>

    <script>

        const budgetInput = document.getElementById("budget");
        const unlimitedBudget = document.getElementById("unlimited-budget");

        unlimitedBudget.addEventListener("change", function () {

            if (this.checked) {
                budgetInput.disabled = true;
                budgetInput.required = false;
                budgetInput.value = "";
            } else {
                budgetInput.disabled = false;
                budgetInput.required = true;
            }

        });

    </script>

</body>

</html>
